name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test --nologo -c Release

      - name: Sample
        run: |
          dotnet run --project samples/AlmaConsole --nologo -c Release
          dotnet run --project samples/AlmaTimeline --nologo -c Release
